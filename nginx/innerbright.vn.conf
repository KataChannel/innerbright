# Nginx configuration for innerbright.vn - Optimized for Next.js
# Rate limiting zones - defined at http level
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/s;

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name innerbright.vn www.innerbright.vn;
    
    # Security headers for HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        access_log off;
        log_not_found off;
    }
    
    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - Main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name innerbright.vn www.innerbright.vn;

    # SSL Configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/innerbright.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innerbright.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enhanced SSL settings for better security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_early_data on;

    # Security headers - Enhanced for production
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "index, follow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy optimized for Next.js
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://www.google-analytics.com https://api.innerbright.vn; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Gzip compression - Enhanced
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/json
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rdf+xml
        application/wasm
        image/svg+xml;

    # Brotli compression (enable if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client settings - Optimized for file uploads and large requests
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy settings - Optimized for Next.js
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Main Next.js application
    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://innerbright-site:3000;
        
        # Handle WebSocket connections for Next.js Hot Reload
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Cache headers for HTML pages
        add_header Cache-Control "no-cache, must-revalidate";
        
        # Security headers for main app
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    # API routes with enhanced rate limiting
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://innerbright-site:3000;
        
        # API-specific headers
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Authentication routes with very strict rate limiting
    location ~* ^/api/(auth|login|register|password|forgot|reset) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://innerbright-site:3000;
        
        # Enhanced security for auth endpoints
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # Next.js static files with aggressive caching
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";
        proxy_pass http://innerbright-site:3000;
        
        # Enable compression for static assets
        gzip_static on;
    }

    # Next.js image optimization
    location /_next/image {
        expires 7d;
        add_header Cache-Control "public";
        add_header Vary "Accept";
        proxy_pass http://innerbright-site:3000;
    }

    # Static assets with optimized caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf|pdf|zip)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";
        proxy_pass http://innerbright-site:3000;
        
        # Enable compression for assets
        gzip_static on;
    }

    # Images with optimized caching and WebP support
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding, Accept";
        add_header X-Content-Type-Options "nosniff";
        proxy_pass http://innerbright-site:3000;
        
        # WebP/AVIF support
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            proxy_pass http://innerbright-site:3000;
        }
    }

    # Favicon with long-term caching
    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://innerbright-site:3000;
        access_log off;
        log_not_found off;
    }

    # Robots.txt with moderate caching
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
        proxy_pass http://innerbright-site:3000;
        access_log off;
    }

    # Sitemap with hourly updates
    location ~* /sitemap.*\.xml$ {
        expires 1h;
        add_header Cache-Control "public";
        proxy_pass http://innerbright-site:3000;
    }

    # Manifest files
    location ~* \.(manifest|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
        proxy_pass http://innerbright-site:3000;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://innerbright-site:3000;
        add_header Cache-Control "no-cache";
    }

    # Service Worker
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        proxy_pass http://innerbright-site:3000;
    }

    # Upload files via MinIO
    location /uploads/ {
        limit_req zone=uploads burst=10 nodelay;
        proxy_pass http://innerbright-minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # File upload settings
        client_max_body_size 100M;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        
        # CORS headers for file uploads
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization" always;
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Block access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block access to sensitive files
    location ~* \.(env|log|htaccess|htpasswd|ini|bak|conf|sql|dump|tar|gz|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block WordPress and PHP specific attacks
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|admin\.php|config\.php|install\.php) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block common bot patterns
    location ~* /(phpmyadmin|phpinfo|admin|administrator|adminer) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block shell uploads
    location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Rate limiting for specific paths
    location ~* ^/(login|register|contact|search) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://innerbright-site:3000;
    }

    # Custom error pages
    error_page 404 /404;
    error_page 500 502 503 504 /500;

    # Logging with enhanced format
    access_log /var/log/nginx/innerbright.vn.access.log combined;
    error_log /var/log/nginx/innerbright.vn.error.log warn;
}

# Additional server block for www redirect (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.innerbright.vn;

    # SSL Configuration (same as main)
    ssl_certificate /etc/letsencrypt/live/innerbright.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innerbright.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to non-www
    return 301 https://innerbright.vn$request_uri;
}
