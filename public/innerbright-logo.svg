<!-- InnerBright Logo -->
<svg width="200" height="48" viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular logo part -->
  <g transform="translate(0, 4)">
    <!-- Outer circles -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#3F51B5" stroke-width="2" opacity="0.8"/>
    <circle cx="20" cy="20" r="14" fill="none" stroke="#3F51B5" stroke-width="2" opacity="0.6"/>
    <circle cx="20" cy="20" r="10" fill="none" stroke="#3F51B5" stroke-width="2" opacity="0.4"/>
    <circle cx="20" cy="20" r="6" fill="none" stroke="#3F51B5" stroke-width="2" opacity="0.3"/>
    
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="#FF6B35"/>
  </g>
  
  <!-- Text part -->
  <g transform="translate(50, 8)">
    <!-- "inner" text -->
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#3F51B5">inner</text>
    <!-- "Bright" text -->
    <text x="45" y="18" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FF6B35">Bright</text>
    
    <!-- Subtitle -->
    <text x="0" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Training &amp; Coaching</text>
  </g>
</svg>