services:
  site:
    build:
      context: .
      dockerfile: ./site/Dockerfile
    image: innerbright/site:${SITE_VERSION}
    container_name: innerbright-site
    restart: ${RESTART_POLICY}
    ports:
      - "${SITE_PORT}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
