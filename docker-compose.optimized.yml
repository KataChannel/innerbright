# Ultra-optimized Docker Compose configuration for production deployment
# This configuration maximizes performance and minimizes resource usage

version: '3.8'

x-common-variables: &common-variables
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: 1
  TZ: Asia/Ho_Chi_Minh

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

services:
  # Ultra-optimized Site service
  site:
    build:
      context: ./site
      dockerfile: Dockerfile.ultra-optimized
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MINIO_ENDPOINT: ${NEXT_PUBLIC_MINIO_ENDPOINT:-http://localhost:9000}
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-innerbright}-site
    environment:
      <<: *common-variables
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "${SITE_PORT:-3000}:3000"
    networks:
      - app-network
    logging: *default-logging
    <<: *restart-policy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optimized API service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-innerbright}-api
    environment:
      <<: *common-variables
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-innerbright}
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - app-network
    logging: *default-logging
    <<: *restart-policy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # High-performance PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-innerbright}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innerbright}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-innerbright}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    # PostgreSQL performance tuning
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # High-performance Redis
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-innerbright}-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Optimized MinIO
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-innerbright}-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_COMPRESS: "on"
      MINIO_COMPRESS_EXTENSIONS: ".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx"
      MINIO_COMPRESS_MIME_TYPES: "application/pdf,application/msword,application/vnd.ms-powerpoint,application/vnd.ms-excel"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    logging: *default-logging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Lightweight pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME:-innerbright}-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@innerbright.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    depends_on:
      postgres:
        condition: service_healthy

# Optimized networks
networks:
  app-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-innerbright}-network
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Optimized volumes with performance settings
volumes:
  postgres_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-innerbright}-postgres-data
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres

  redis_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-innerbright}-redis-data
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis

  minio_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-innerbright}-minio-data
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/minio

  pgadmin_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-innerbright}-pgadmin-data
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/pgadmin
