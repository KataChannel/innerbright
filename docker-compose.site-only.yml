version: '3.8'

services:
  site:
    build:
      context: ./site
      dockerfile: Dockerfile
      args:
        BUILD_SITE_ONLY: "true"
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: "1"
    image: innerbright-site:latest
    container_name: innerbright-site-only
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-3000}:3000"
    environment:
      BUILD_SITE_ONLY: "true"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.services.site.loadbalancer.server.port=3000"

networks:
  default:
    name: innerbright-site-network
