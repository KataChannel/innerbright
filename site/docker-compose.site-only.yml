version: '3.8'

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_SITE_ONLY=true
        - NODE_ENV=production
    container_name: innerbright-site-only
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BUILD_SITE_ONLY=true
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - innerbright-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  innerbright-network:
    driver: bridge
