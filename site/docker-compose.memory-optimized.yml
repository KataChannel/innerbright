version: '3.8'

services:
  # Main site service with strict memory limits
  site:
    build:
      context: .
      dockerfile: Dockerfile.site-only
      args:
        - NODE_ENV=production
        - BUILD_SITE_ONLY=true
        - DISABLE_PWA_BUILD=true
        - NODE_OPTIONS=--max-old-space-size=512
    
    container_name: innerbright-site
    
    # Strict resource limits to prevent OOM
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.5'
        reservations:
          memory: 200M
          cpus: '0.25'
    
    # Memory-optimized environment variables
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3000
      - HOSTNAME=0.0.0.0
    
    ports:
      - "3000:3000"
    
    restart: unless-stopped
    
    # Health check with minimal resource usage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--timeout=5", "http://localhost:3000/"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 30s
    
    # Security and optimization
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    
    # Logging with size limits
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy (if needed)
  nginx:
    image: nginx:alpine
    container_name: innerbright-nginx
    
    # Minimal resource allocation
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    
    ports:
      - "80:80"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    
    depends_on:
      - site
    
    restart: unless-stopped
    
    profiles:
      - with-nginx

# Network configuration
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

# Volumes for caching (if needed)
volumes:
  npm_cache:
    driver: local
