services:
  postgres:
    image: postgres:15-alpine
    container_name: innerbright-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    
    # Resource limits for low-resource server
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.3'
        reservations:
          memory: 100M
          cpus: '0.1'
    
    networks:
      - innerbright-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  redis:
    image: redis:7-alpine
    container_name: innerbright-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 32mb --maxmemory-policy allkeys-lru
    
    # Resource limits for low-resource server
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.1'
    
    networks:
      - innerbright-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  site:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        BUILD_SITE_ONLY: "true"
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: "1"
    image: innerbright/site:latest
    container_name: innerbright-site
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-3000}:3000"
    environment:
      BUILD_SITE_ONLY: "true"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # Minimal environment variables for low-resource deployment
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-error}
    
    # Resource limits for low-resource server
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.6'
        reservations:
          memory: 200M
          cpus: '0.2'
    
    networks:
      - innerbright-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  innerbright-network:
    driver: bridge
    name: innerbright-network

volumes:
  postgres_data:
    name: innerbright-postgres-data
  redis_data:
    name: innerbright-redis-data
